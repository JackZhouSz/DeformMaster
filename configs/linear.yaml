# DeformMaster linear (rope) config — inference only.
output_dir: './checkpoints'
tag: 'rope'

data:
  root: './data'
  reverse_z: true
  gaussian_output_dir: './checkpoints/gaussian'

# MPM simulation
mpm:
  use_warp: true
  device: 'cuda'
  n_particles: 100000
  dt: 8e-4
  grid_res: 32
  gravity: [0.0, 0.0, -9.8]
  grid_v_damping_scale: 0.999
  svd_clamp_max: 2.0
  floor_margin: 0.0

  active_experts: ['nh', 'co', 'st']

  max_frames: 300
  steps_per_frame: 42

  controller_radius: 0.08
  controller_max_neighbors: 128
  controller_clamp_dv: 10.0
  controller_smooth_window: 2
  controller_warmup_frames: 3
  controller_keep_n: -1

  material_bounds:
    E: [1e4, 1e6]
    nu: [0.0, 0.35]
    yield_stress: [1e4, 1e7]
    plastic_viscosity: [0.1, 10.0]
    controller_stiffness: [1e4, 5e6]
    controller_damping: [1e2, 5e4]

  boundary:
    type: 'surface_collider'
    point: [0.0, 0.0, 0.0]
    normal: [0.0, 0.0, 1.0]
    surface: 'slip'
    friction: 0.4
    restitution: 0.5
    start_time: 0.0
    end_time: 1000.0

# Residual PGND
residual:
  enabled: true
  feature_dim: 64
  radius: 0.05
  n_history: 3
  grid_res_list: [32, 32, 32]
  pe_num_func: 6
  num_layers: 4
  hidden_size: 128
  input_scale: 1.0
  output_scale: 1.0
